services:
  - type: web
    name: chest-xray-ai-backend
    runtime: docker
    dockerfilePath: ./Backend chest x ray/Dockerfile
    dockerContext: ./Backend chest x ray
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: chest_xray_ai
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

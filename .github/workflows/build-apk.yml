name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK via Capacitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Skip model LFS for speed)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: './Frontend chest x ray'
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        working-directory: './Frontend chest x ray'
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: './Frontend chest x ray'
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: './Frontend chest x ray/android'
        run: chmod +x gradlew

      - name: Install Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Android Debug APK
        working-directory: './Frontend chest x ray/android'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chest-XRay-AI-Debug-APK
          path: Frontend chest x ray/android/app/build/outputs/apk/debug/app-debug.apk
